variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  PROJECT_NAME: "flight-performances-back"
  MVN_VERSION: 3.9.5-amazoncorretto-21

image: maven:$MVN_VERSION
services:
  - docker:24.0.5-dind

stages:
  - build
  - sonar
  - package

cache:
  paths:
    - .m2/repository

build:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - "**/target"

sonar:
  stage: sonar
  script:
    - mvn sonar:sonar -Dsonar.host.url=$SONAR_HOST -Dsonar.login=$SONAR_TOKEN -Dsonar.projectKey=$PROJECT_NAME

package:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --build-arg "JAR_FILE=flight-perfs-back-$CI_COMMIT_TAG.jar"
      --destination "$CI_REGISTRY/$PROJECT_NAME:$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG
